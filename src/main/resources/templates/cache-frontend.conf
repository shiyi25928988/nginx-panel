# ============================================================
# Nginx Shell 内嵌模板：静态资源强缓存
# 适用：可单独 include，或复制进站点 server 块
# 原则：带 hash 的文件长缓存，无 hash 的短缓存
# ============================================================

# 可直接放 server 块内：
location ~* \.(?:css|js)$ {
    # 带 hash 的构建产物可改成 1y；无 hash 需要短缓存让更新快速生效
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~* \.(?:woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}
