# ============================================================
# Nginx Shell 内嵌模板：HTTPS + HTTP 80 跳转
# 适用：SSL 证书站点（Let's Encrypt / 已有 pem+key）
# ============================================================
# 80 → 443 强制跳转
server {
    listen 80;
    server_name {{DOMAIN}};
    # ACME http-01 验证路径例外（certbot --webroot）
    location /.well-known/acme-challenge/ {
        root {{ACME_WEBROOT}};
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    # ---- 证书路径 ----
    ssl_certificate     {{SSL_CERT_PATH}};
    ssl_certificate_key {{SSL_KEY_PATH}};

    # ---- SSL 加固（TLS1.2+/现代套件） ----
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    # ---- 站点内容 ----
    root {{ROOT_DIR}};
    index index.html index.htm;

    # 或改为反代后端：
    # location / {
    #     proxy_pass {{BACKEND_URL}};
    #     proxy_set_header Host $host;
    # }

    # HSTS（确认 HTTPS 稳定运行后再开启）
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
