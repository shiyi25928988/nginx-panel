# ============================================================
# Nginx Shell 内嵌模板：主配置 nginx.conf
# 适用：全新安装的主配置文件骨架
# 放置位置：配置根目录下 nginx.conf（覆盖前务必备份原文件！）
# ============================================================
user {{RUN_USER}};
worker_processes {{WORKER_PROCESSES}};
pid {{PID_FILE}};
error_log {{LOG_DIR}}/error.log warn;

events {
    # 单 worker 最大连接数（含所有代理/静态请求）
    worker_connections {{WORKER_CONNECTIONS}};
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log {{LOG_DIR}}/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    # 上传大小限制，按需调整（默认 1m 会导致大表单/上传 413）
    client_max_body_size  {{UPLOAD_MAX_SIZE}};

    # 开启 gzip（公共片段模板 gzip-security.conf 也可替换为 include）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 站点配置目录（conf.d/*.conf 会全部被加载）
    include /etc/nginx/conf.d/*.conf;

    # 默认站点：未匹配到具体 server_name 的请求返回 444（直接断开）
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
