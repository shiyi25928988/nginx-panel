# ============================================================
# Nginx Shell 内嵌模板：静态网站
# 适用：普通 HTML/静态资源站点
# 建议：保存到 conf.d/ 目录（会被主配置 include 自动生效）
# ============================================================
server {
    listen 80;
    # 绑定域名（可写多个，空格分隔；IP 访问可写 _ 或 IP 本身）
    server_name {{DOMAIN}};

    # 网站根目录
    root {{ROOT_DIR}};
    index index.html index.htm;

    # 404 页面
    error_page 404 /404.html;

    # 拒绝访问隐藏文件（.git/.htaccess/.env 等），重要！
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 静态资源缓存（也可用"静态资源缓存"模板的公共片段）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 前端路由（Vue/React hash=false）时取消注释：
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
}
