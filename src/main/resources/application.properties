server.port=8080

# HTTP 连接空闲超时(毫秒)
server.idleTimeout=300000

# HTTPS（可选）：启用时启动自动生成自签名证书
server.ssl.enabled=false
server.ssl.host=127.0.0.1
server.ssl.cert.dir=certs
server.ssl.keystore.password=plinth

# ---- 内置管理员（仅空库首次创建时生效）----
admin.default.username=admin
admin.default.password=admin123

# ---- 会话 ----
token.expire=86400

# ---- 嵌入式 H2 数据库 ----
mybatis.environment.id=development
JDBC.driver=org.h2.Driver
JDBC.url=jdbc:h2:file:./data/nginx_shell;MODE=MySQL;DB_CLOSE_DELAY=-1
JDBC.username=sa
JDBC.password=
mybatis.mapper.scan=yi.shi.plinth.db.mapper

# ---- Nginx ----
# nginx 配置根目录（conf.d 等都挂在这下面）
nginx.conf.dir=/etc/nginx
# 面板证书工作目录（上传/自签统一收口；/etc/ssl 等系统证书不参与面板替换）
cert.dir=/app/certs
# nginx 可执行文件路径（native 模式）
nginx.bin=nginx
# 执行模式：native=宿主机进程 | docker=docker exec 进入 nginx 容器执行
nginx.exec.mode=native
# docker 模式下 nginx 容器名
nginx.docker.container=nginx
# 逐条命令前是否加 sudo（native 模式、面板以非 root 运行时）
nginx.sudo=false
# nginx master 进程 pid 文件（native 模式探测运行状态用，留空跳过检测）
nginx.pid.file=/run/nginx.pid
